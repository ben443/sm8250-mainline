name: Build Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v2
    
    - name: Download AOSP clang
      run: |
        mkdir -p /home/runner/clang
        wget -O /home/runner/clang/clang-r428724.tar.gz https://kali.download/nethunter-images/toolchains/clang-r416183b1.tar.gz

jobs:
  Build-Kernel:
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Build Kernel
      uses: dabao1955/kernel_build_action@main
      with:
          kernel-url: https://github.com/ben443/sm8250-mainline.git
          kernel-branch: sm8250/v6.10
          config: sm8250_defconfig nh.config
          arch: arm64
          aosp-gcc: true
          aosp-clang: true
          ksu: false
          ksu-version: main
          android-version: 12
          aosp-clang-version: r428724
          disable-lto: true
          anykernel3: false
